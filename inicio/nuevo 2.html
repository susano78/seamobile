<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Premium | Feliz-IA</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Presentación de vídeo premium con estética moderna.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>

<body>
    <div class="container">
        <header>
            <h1>Presentación Especial</h1>
            <p class="subtitle">Disfruta de este contenido en alta definición</p>
        </header>

        <main>
            <div class="video-wrapper">
                <div class="video-container" id="player"></div>
            </div>
        </main>
    </div>

    <script>
        // Load the IFrame Player API code asynchronously.
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // This function creates an <iframe> (and YouTube player)
        // after the API code downloads.
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'ZWnFPo11OMg',
                playerVars: {
                    'playsinline': 1,
                    'origin': window.location.origin === "null" ? "http://localhost" : window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            console.log("Player ready");
        }

        function onPlayerError(event) {
            console.error("Error code: " + event.data);
            if (event.data === 150 || event.data === 101) {
                alert("Este vídeo no permite reproducción en sitios externos. Intenta abrirlo directamente en YouTube.");
            }
        }
    </script>
</body>

</html>
